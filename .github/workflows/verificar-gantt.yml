name: Verificar Gantt
on:
  pull_request:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check docs-cliente/gantt/calculo.js
      - run: node --check docs-cliente/gantt/app.js
      - run: node --check scripts/generar-gantt.mjs
      - run: node --test scripts/calculo.test.mjs
